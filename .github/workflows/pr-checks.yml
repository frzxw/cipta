name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  statuses: write

jobs:
  # ─────────────────────────────────────────────
  # Validate PR title follows Conventional Commits
  # ─────────────────────────────────────────────
  title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types from CONTRIBUTING.md
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            style
          # Allowed scopes matching monorepo packages
          scopes: |
            api
            web
            worker
            database
            shared
            ui
            docs
            infra
          requireScope: true
          subjectPattern: ^.+$
          subjectPatternError: 'PR title must have a description after the scope.'

  # ─────────────────────────────────────────────
  # Check PR description isn't empty
  # ─────────────────────────────────────────────
  pr-description:
    name: PR Description Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '').trim();

            if (body.length < 20) {
              core.setFailed(
                'PR description is too short. Please describe what this PR does, ' +
                'reference the spec/feature, and list key changes.'
              );
              return;
            }

            core.info('PR description looks good.');
